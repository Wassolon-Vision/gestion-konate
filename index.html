<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KONATÉ &amp; FRÈRE – Gestion</title>
<style>
:root{--b:#16307f;--b2:#e8eefb;--o:#f5b800;--bg:#f6f8fc;--t:#12203f;--c:#fff;--l:#d7deee;--g:#1f9d55;--r:#d6362b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1426;--t:#e8eefb;--c:#14203a;--l:#26365c;--b2:#1a2a52;--b:#5b8cff;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:78px}
#wm{position:fixed;inset:0;background:url(logo.png) center/70% no-repeat;opacity:.05;pointer-events:none;z-index:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--b);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:4px solid var(--o)}
header img{height:44px;background:#fff;border-radius:50%;padding:0}header b{font-size:17px}header small{display:block;opacity:.85;font-size:12px}
main{position:relative;z-index:1;padding:14px;max-width:760px;margin:auto}
h2{margin:6px 0 12px;font-size:20px;color:var(--b)}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:10px}
.kp{border-left:5px solid var(--o)}.kp small{color:#6b7794;display:block}.kp b{font-size:18px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--l)}.row:last-child{border:0}
.row small{color:#6b7794;display:block}
button,.btn{background:var(--b);color:#fff;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer}
button.o{background:var(--o);color:#1b1200}button.w{background:#1fa855}button.s{background:var(--b2);color:var(--b)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.bar>*{flex:1}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;font:inherit;background:var(--c);color:var(--t);margin:4px 0 8px}
label{font-size:14px;color:#6b7794}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--c);border-top:3px solid var(--o);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:#6b7794;border-radius:0;padding:10px 2px;font-size:12px}nav button.on{color:var(--b);background:var(--b2)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:700}.ok{background:#d9f3e4;color:#0d6b37}.no{background:#fde0dd;color:#9a1d14}.al{background:#fff0d1;color:#8a5200}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{white-space:nowrap;padding:8px 12px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tl button{padding:18px 8px;text-align:center;background:var(--c);color:var(--t);border:1px solid var(--l)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--l);text-align:left}th{color:var(--b)}.n{text-align:right}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--t);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:20;display:none}
#lk{position:fixed;inset:0;z-index:30;background:var(--b);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}#lk img{width:220px;background:#fff;border-radius:50%;padding:0}#lk input{width:180px;text-align:center;font-size:24px;letter-spacing:8px}
.rc{display:none}
@media print{header,nav,#wm,.np,#t{display:none!important}body{background:#fff;color:#000}.card{border:0}}

else if(tab=='ch')h+=`<div class="card"><b>Nouvelle charge</b><label>Libellé</label><input id="ch_l"><label>Catégorie</label><select id="ch_c">${['Loyer','Transport','Salaires','Électricité / eau','Taxes','Autre'].map(x=>`<option>${x}</option>`).join('')}</select><label>Montant (GNF)</label><input id="ch_m" type="number" inputmode="numeric"><label>Date</label><input id="ch_d" type="date" value="${td()}"><button class="o" style="width:100%" onclick="addch()">Ajouter la charge</button></div><div class="card"><div class="row"><b>Total des charges ${yr}</b><b>${fm(sm(D.h.filter(x=>x.d.startsWith(yr)),x=>x.m))}</b></div>${D.h.map(x=>`<div class="row"><span>${x.l||x.c}<small>${x.d} · ${x.c}</small></span><span>${fm(x.m)} <button class="s" onclick="delch(${x.id})">✕</button></span></div>`).join('')||'<small>Aucune charge.</small>'}</div>`;
else{const v=V().filter(x=>x.d.startsWith(yr)),a=A().filter(x=>x.d.startsWith(yr)),TV=sm(v,x=>x.tot),C=sm(v,x=>sm(x.l,l=>l.q*(l.c||0))),TA=sm(a,x=>x.tot),R=TV-C,CHG=sm(D.h.filter(x=>x.d.startsWith(yr)),x=>x.m),NET=R-CHG;
h+=`<div class="card"><b>Compte de résultat · exercice ${yr}</b>${[['Ventes de marchandises',TV],['Coût d’achat des marchandises vendues',C],['Résultat brut (marge)',R],['Charges de l’exercice',CHG],['Résultat net',NET],['Achats de l’exercice',TA],['Encaissements',sm(v,pd)],['Décaissements',sm(a,pd)]].map(r=>`<div class="row"><span>${r[0]}</span><b>${fm(r[1])}</b></div>`).join('')}<p class="pill ${NET>=0?'ok':'no'}">${NET>=0?'Bénéfice':'Perte'} net : ${fm(NET)}</p></div>`}return h};
function addch(){const m=+$('#ch_m').value||0;if(m<=0)return toast('Montant invalide');const o={id:Date.now(),d:$('#ch_d').value||td(),l:$('#ch_l').value,c:$('#ch_c').value,m};D.h.unshift(o);W('h',o);toast('Charge ajoutée');render()}
function delch(id){if(!confirm('Supprimer cette charge ?'))return;DEL('h',id);render()}
function rel(k,id){es={rk:k,rid:id};cur='rel';render();scrollTo(0,0)}
const rdocs=()=>arr(es.rk=='c'?'v':'a').filter(x=>x.tid==es.rid&&!x.x).sort((a,b)=>a.id-b.id),rtier=()=>D[es.rk].find(x=>x.id==es.rid);
P.rel=()=>{const t=rtier();if(!t)return'';const L=rdocs(),tot=sm(L,x=>x.tot),pa=sm(L,pd),r=tot-pa,c=es.rk=='c';
return`<div style="text-align:center"><b>${D.s.n}</b><br><small>${D.s.a} ${D.s.t}</small></div><h2>Relevé · ${t.n}</h2><small>${t.t||''}</small><div class="card"><div class="row"><span>Total ${c?'des ventes':'des achats'}</span><b>${fm(tot)}</b></div><div class="row"><span>Déjà ${c?'encaissé':'payé'}</span><span>${fm(pa)}</span></div><div class="row"><b>${c?'Reste à encaisser':'Reste à payer'}</b><b style="color:var(--${r>0?'r':'g'})">${fm(r)}</b></div></div>
${r>0?`<div class="card np"><label>Montant ${c?'encaissé':'payé'} (GNF) – réparti sur les plus anciennes factures</label><input id="rm" type="number" inputmode="numeric"><button class="o" style="width:100%" onclick="rpay()">${c?'Encaisser':'Payer'}</button></div>`:''}
<div class="card"><b>Détail</b>${L.map(x=>dRow({...x,k:c?'v':'a'})).join('')||'<small>Aucune opération.</small>'}</div>
<div class="bar np"><button class="w" onclick="wa(rltxt())">WhatsApp</button><button onclick="print()">PDF / Imprimer</button><button class="s" onclick="go('cpt')">Retour</button></div>`};
function rpay(){let m=+$('#rm').value||0;if(m<=0)return toast('Montant invalide');const L=rdocs().filter(x=>x.tot>pd(x)),tot=sm(L,x=>x.tot-pd(x));if(m>tot)m=tot;let left=m;L.forEach(x=>{if(left<=0)return;const a=Math.min(left,x.tot-pd(x));PAY(es.rk=='c'?'v':'a',x,a);left-=a});toast('Règlement enregistré : '+fm(m));render()}
function rltxt(){const t=rtier(),L=rdocs(),r=sm(L,x=>x.tot-pd(x));return`*${D.s.n}*\nRelevé de compte – ${t.n}\n${td()}\n\n${L.map(x=>`${x.no} (${x.d}) : ${fm(x.tot)} – reste ${fm(x.tot-pd(x))}`).join('\n')}\n\n*Reste : ${fm(r)}*`}
const jr=()=>{const e=[];V().forEach(x=>{e.push({d:x.d,i:x.id,l:`Vente ${x.no} · ${tn('v',x.tid)}`,db:x.tot,cr:0});x.pays.forEach(p=>e.push({d:p.d,i:x.id+1,l:`Encaissement ${x.no}`,db:0,cr:p.m}))});A().forEach(x=>{e.push({d:x.d,i:x.id,l:`Achat ${x.no} · ${tn('a',x.tid)}`,db:0,cr:x.tot});x.pays.forEach(p=>e.push({d:p.d,i:x.id+1,l:`Décaissement ${x.no}`,db:p.m,cr:0}))});D.h.forEach(x=>e.push({d:x.d,i:x.id,l:`Charge · ${x.l||x.c}`,db:0,cr:x.m}));return e.sort((a,b)=>b.d.localeCompare(a.d)||b.i-a.i)};
P.jr=()=>`<h2>Journal centralisé</h2><div class="card tw"><table><tr><th>Date</th><th>Libellé</th><th class="n">Débit</th><th class="n">Crédit</th></tr>${jr().map(e=>`<tr><td>${e.d.slice(5)}</td><td>${e.l}</td><td class="n">${e.db?fm(e.db):''}</td><td class="n">${e.cr?fm(e.cr):''}</td></tr>`).join('')||'<tr><td colspan="4">Journal vide.</td></tr>'}</table></div>`;
P.rap=()=>{const d=rd||td(),v=V().filter(x=>x.d==d),a=A().filter(x=>x.d==d),en=sm(V(),x=>sm(x.pays.filter(p=>p.d==d),p=>p.m)),de=sm(A(),x=>sm(x.pays.filter(p=>p.d==d),p=>p.m)),ch=sm(D.h.filter(x=>x.d==d),x=>x.m);
return`<h2>Rapport journalier</h2><div class="card"><input type="date" value="${d}" onchange="rd=this.value;render()">${[['Nombre de ventes',v.length],['Total des ventes',fm(sm(v,x=>x.tot))],['Total des achats',fm(sm(a,x=>x.tot))],['Encaissé',fm(en)],['Décaissé',fm(de)],['Charges du jour',fm(ch)],['Solde de caisse du jour',fm(en-de-ch)],['Produits en alerte',stk().length]].map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div><div class="bar np"><button class="w" onclick="wa('*${D.s.n}* – Rapport du ${d}\\nVentes : '+${sm(v,x=>x.tot)}+' GNF\\nEncaissé : '+${en}+' GNF')">WhatsApp</button><button onclick="print()">PDF / Imprimer</button></div>`};
P.set=()=>`<h2>Paramètres</h2><div class="card"><label>Nom de l’entreprise</label><input id="s_n" value="${D.s.n}"><label>Adresse</label><input id="s_a" value="${D.s.a}"><label>Téléphone</label><input id="s_t" value="${D.s.t}"><label>Code PIN (laisser vide pour désactiver)</label><input id="s_p" type="password" inputmode="numeric" maxlength="8" value="${D.s.pin}"><button style="width:100%" onclick="ss()">Enregistrer</button></div>
<div class="card"><b>Gérer les données</b><div class="bar"><button class="s" onclick="ed('p')">+ Produit</button><button class="s" onclick="es.kind='c';go('ls')">Clients</button><button class="s" onclick="es.kind='f';go('ls')">Fournisseurs</button></div></div>
<div class="card"><b>Sauvegarde et synchronisation</b><p><small>Vos données sont enregistrées sur ce téléphone, même sans internet. Pour les copier sur un autre téléphone, envoyez la sauvegarde puis restaurez-la là-bas.</small></p><div class="bar"><button class="w" onclick="wa(JSON.stringify(D))">Envoyer par WhatsApp</button><button class="s" onclick="bk()">Copier</button></div>${db?'<div class="bar"><button class="s" onclick="up()">Envoyer mes données vers le cloud</button><button class="s" onclick="deco()">Se déconnecter</button></div>':''}<label>Coller une sauvegarde à restaurer</label><textarea id="rs" rows="3"></textarea><button class="o" style="width:100%" onclick="rs()">Restaurer</button></div>`;
function ss(){D.s={n:$('#s_n').value||'KONATÉ & FRÈRE',a:$('#s_a').value,t:$('#s_t').value,pin:$('#s_p').value};try{localStorage.setItem('kf_pin',D.s.pin)}catch(e){}save();if(db)db.collection('kf_reglages').doc('main').set({n:D.s.n,a:D.s.a,t:D.s.t});toast('Paramètres enregistrés')}
function bk(){const t=JSON.stringify(D);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Sauvegarde copiée'),()=>{$('#rs').value=t;$('#rs').select();toast('Copiez le texte affiché')})}
function rs(){try{const o=JSON.parse($('#rs').value);if(!o.p||!o.v)throw 0;D=o;['p','c','f','v','a','h','i'].forEach(k=>D[k]=D[k]||[]);D.s=D.s||{n:'',a:'',t:''};D.s.pin='';save();up();toast('Données restaurées');go('home')}catch(e){toast('Sauvegarde invalide')}}
P.aide=()=>`<h2>Aide</h2>${[['Démarrer','Dans Paramètres, ajoutez vos produits (pièces détachées), vos clients et vos fournisseurs.'],['Faire une vente','Touchez Vente, choisissez le client, ajoutez les articles, saisissez le montant reçu, puis Enregistrer. Le stock baisse automatiquement.'],['Facture non réglée','Ouvrez le reçu dans Historique et saisissez le règlement quand le client paie. Les comptes débiteurs et créditeurs se mettent à jour.'],['Envoyer un reçu','Sur un reçu, touchez WhatsApp ou PDF / Imprimer (choisissez « Enregistrer en PDF »).'],['Annuler une opération','Ouvrez le reçu et touchez Annuler. Le stock est remis à jour et la trace reste dans l’historique.'],['Charges','Menu puis Charges : ajoutez loyer, transport, salaires… Elles sont déduites dans le compte de résultat.'],['Encaisser un client','Comptes puis Clients : touchez un nom pour voir son relevé et encaisser un montant, réparti sur ses plus anciennes factures.'],['Retour de marchandise','Ouvrez le reçu et utilisez « Retour de marchandise » : le stock est remis et le total corrigé.'],['Inventaire','Menu puis Inventaire : saisissez les quantités comptées, validez, et le stock est corrigé avec la trace de l’écart.'],['Sauvegarde','Envoyez régulièrement votre sauvegarde par WhatsApp pour ne rien perdre en cas de changement de téléphone.']].map(x=>`<div class="card"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}`;
load();
if(D.s.pin){const l=$('#lk');l.style.display='flex';$('#pn').oninput=e=>{if(e.target.value==D.s.pin){l.style.display='none';e.target.value=''}}}
